spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
