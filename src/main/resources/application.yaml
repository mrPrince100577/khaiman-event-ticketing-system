spring:
  application:
    name: khaiman
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Tài khoản admin đầu tiên, AdminAccountInitializer tạo khi app khởi động nếu chưa có.
# Giá trị lấy từ biến môi trường (dev: file .env). Để trống ADMIN_PASSWORD thì bỏ qua.
app:
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

